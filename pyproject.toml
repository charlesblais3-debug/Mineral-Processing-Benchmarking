[project]
name = "mineral-processing-benchmarking"
version = "0.1.0"
description = "Benchmarking database built from public mining technical reports"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "httpx>=0.27",
  "pymupdf>=1.24",
]

[project.optional-dependencies]
parse = ["docling>=2.0", "ocrmypdf>=16.0"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
