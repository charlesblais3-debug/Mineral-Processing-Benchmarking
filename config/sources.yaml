# Where the pipeline looks for reports. All sources here allow automated access.
# SEDAR+ is deliberately absent: its terms prohibit automated access.

version: 1

polite_crawling:
  # User-Agent is "MPBenchmark/0.1 <CONTACT_NAME> <CONTACT_EMAIL>" from .env (SEC requires a contact)
  min_seconds_between_requests_per_domain: 3
  respect_robots_txt: true
  max_pdf_mb: 400

edgar:
  enabled: true
  max_requests_per_second: 8      # SEC limit is 10
  sic_codes: [1000, 1011, 1040, 1090, 1400, 3312, 6795]
  # Named full-text queries (EDGAR matches quoted phrases exactly). Scoped to v1:
  # gold CIL/CIP/gravity, copper flotation, nickel sulphide flotation.
  queries:
    trs_gold_cil:        '"technical report summary" gold "carbon-in-leach"'
    trs_gold_cip:        '"technical report summary" gold "carbon-in-pulp"'
    trs_gold_gravity:    '"technical report summary" gold "gravity concentrate"'
    trs_copper_flot:     '"technical report summary" copper flotation concentrate'
    trs_nickel_flot:     '"technical report summary" nickel flotation concentrate'
    ni43101_gold_cil:    '"NI 43-101" "technical report" gold "carbon-in-leach"'
    ni43101_gold_cip:    '"NI 43-101" "technical report" gold "carbon-in-pulp"'
    ni43101_copper_flot: '"NI 43-101" "technical report" copper flotation concentrate'
    ni43101_nickel_flot: '"NI 43-101" "technical report" nickel flotation concentrate'
    trs_nickel_laterite: '"technical report summary" nickel laterite'
    ni43101_nickel_laterite: '"NI 43-101" "technical report" nickel laterite'
    trs_iron_ore:        '"technical report summary" "iron ore" concentrate'
    trs_taconite:        '"technical report summary" taconite pellets'
    ni43101_iron_ore:    '"NI 43-101" "technical report" "iron ore" concentrate'

company_sites:
  enabled: true
  seed_lists:
    - tmx_mining_issuers       # TSX/TSXV mining issuer list (public Excel)
    - asx_listed_companies     # ASX company list (public CSV), materials sector
  link_patterns: ["technical report", "43-101", "ni43-101", "feasibility", "pre-feasibility", "prefeasibility", "preliminary economic assessment", "pea", "jorc"]

search_api:
  enabled: false               # optional; set BRAVE_API_KEY in .env to enable
  queries:
    - '"NI 43-101" "feasibility study" {commodity} {flowsheet} filetype:pdf'
    - '"technical report" "{project}" filetype:pdf'

inbox:
  path: reports/_inbox

# v1 scope (agreed): gold CIL/gravity first, then copper flotation, then nickel sulphide.
scope_v1:
  commodities: [Au, Cu, Ni, Fe, Ag, Zn, Pb]
  study_levels: [PEA, PFS, FS, operating]
  report_years_min: 2012
