# Company websites the crawler visits to find technical reports that are not on SEC EDGAR
# (mostly TSX/TSXV-only issuers). Add a line to cover a new company; the crawler follows
# robots.txt and only reads investor / project / technical-report pages.
#   commodity: main v1 commodity (Au, Cu, Ni) - used to prioritise extraction
#   projects:  names to look for in link text (optional, helps label results)
#   pages:     report pages to read first, when the site menu does not lead to them (optional)

