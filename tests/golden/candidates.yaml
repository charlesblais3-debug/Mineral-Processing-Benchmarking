# Golden set candidates: ~20 reports checked once by hand to measure extraction accuracy.
# Chosen to cover each v1 commodity / flowsheet family / study level / standard.
# Final picks are confirmed in phase 1 once discovery has found and downloaded the actual reports;
# any candidate whose report can't be obtained automatically gets swapped for a similar project.

selection_rules:
  - at least 2 operating-mine reports (actual costs) per commodity
  - at least 1 S-K 1300 report per commodity (tests the EDGAR path)
  - at least 1 report with costs in CAD and 1 in AUD (tests currency handling)
  - at least 1 older report giving Bond work index in kWh/short ton
  - mix of comminution circuits (SABC, HPGR-ball, 3-stage crush + ball)

candidates:
